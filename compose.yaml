services:
  connector:
    build: .
    restart: unless-stopped
    environment:
      DB_PATH: /data/app.sqlite3
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      ERGONODE_ALLOWED_HOSTS: ${ERGONODE_ALLOWED_HOSTS}
      ENABLE_LIVE_WRITES: ${ENABLE_LIVE_WRITES:-false}
      ENABLE_ERGONODE_IMPORTS: ${ENABLE_ERGONODE_IMPORTS:-false}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - connector_data:/data
volumes:
  connector_data:
